name: Release Desktop Bundles

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.1)'
        required: false
        default: ''

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--bundles app,dmg'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'
          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "val=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "val=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "val=v0.1.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build Desktop Application via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: './apps/app'
          tagName: ${{ steps.tag.outputs.val }}
          releaseName: 'DomoLens ${{ steps.tag.outputs.val }}'
          releaseBody: |
            DomoLens Automated Release ${{ steps.tag.outputs.val }}
            - macOS (.dmg, .app)
            - Windows (.exe installer)
            - Linux (.AppImage, .deb)
            - Auto-updater manifest (latest.json)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
