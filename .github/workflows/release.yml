name: Release Desktop Bundles

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.1)'
        required: false
        default: ''

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--bundles app,dmg'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'
          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Release Tag and Version
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="v0.1.${{ github.run_number }}"
          fi
          VER="${TAG#v}"
          echo "val=$TAG" >> $GITHUB_OUTPUT
          echo "ver=$VER" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Synchronize Version Across Project and Tauri Config
        shell: bash
        run: |
          VER="${{ steps.tag.outputs.ver }}"
          echo "Synchronizing project files to release version $VER"
          node -e "
            const fs = require('fs');
            const files = ['package.json', 'apps/app/package.json', 'packages/core/package.json', 'apps/landing/package.json'];
            for (const f of files) {
              if (fs.existsSync(f)) {
                const pkg = JSON.parse(fs.readFileSync(f, 'utf8'));
                pkg.version = '$VER';
                fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + '\n');
              }
            }
            const tauriPath = 'apps/app/src-tauri/tauri.conf.json';
            if (fs.existsSync(tauriPath)) {
              const conf = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
              conf.version = '$VER';
              fs.writeFileSync(tauriPath, JSON.stringify(conf, null, 2) + '\n');
            }
            const cargoPath = 'apps/app/src-tauri/Cargo.toml';
            if (fs.existsSync(cargoPath)) {
              let cargo = fs.readFileSync(cargoPath, 'utf8');
              cargo = cargo.replace(/^version = \".*\"/m, 'version = \"$VER\"');
              fs.writeFileSync(cargoPath, cargo);
            }
          "

      - name: Build Desktop Application via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: './apps/app'
          tagName: ${{ steps.tag.outputs.val }}
          releaseName: 'DomoLens ${{ steps.tag.outputs.val }}'
          releaseBody: |
            DomoLens Automated Release ${{ steps.tag.outputs.val }}
            - macOS (.dmg, .app)
            - Windows (.exe installer)
            - Linux (.AppImage, .deb)
            - Auto-updater manifest (latest.json)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
