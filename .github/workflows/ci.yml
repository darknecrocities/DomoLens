name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npm run test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python engine dependencies
        run: uv sync --project engine

      - name: Run Python engine tests
        run: npm run engine:test

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run Cargo check on Tauri shell
        run: cargo check --manifest-path apps/app/src-tauri/Cargo.toml

      - name: Test production frontend builds
        run: npm run build:all

  verify-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Tauri macOS Configuration Integrity
        shell: bash
        run: |
          node -e "
            const conf = require('./apps/app/src-tauri/tauri.conf.json');
            if (!conf.bundle || !conf.bundle.macOS || !conf.bundle.macOS.signingIdentity) {
              console.error('Error: bundle.macOS.signingIdentity is missing from tauri.conf.json');
              process.exit(1);
            }
            console.log('Tauri macOS signing identity verified:', conf.bundle.macOS.signingIdentity);
          "

      - name: Run Cargo check on Tauri shell (macOS)
        run: cargo check --manifest-path apps/app/src-tauri/Cargo.toml
